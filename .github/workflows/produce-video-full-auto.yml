name: Produce Video (fully automated)

# Uçtan uca otomatik: araştırma -> script (+kalite kontrolü) -> başlık
# -> seslendirme -> altyazı -> sahne görselleri -> kapak -> render ->
# müzik miksajı -> altyazı gömme -> upload.
#
# MİMARİ NOTU (job bölünmesi - maliyet koruması):
# Bu workflow BİLEREK tek job değil, birden fazla BAĞIMLI job'a
# bölünmüştür (needs: ile zincirleme). Her job kendi çıktısını
# actions/upload-artifact ile kaydeder, bir sonraki job bunu
# actions/download-artifact ile indirip kaldığı yerden devam eder.
#
# NEDEN: Tek job'da bir adım patlarsa, GitHub'ın "Re-run" özelliği TÜM
# job'ı sıfırdan çalıştırır - para/zaman israfı. Job'lar ayrıysa,
# "Re-run failed jobs" SADECE başarısız olanı (ve sonrakileri) yeniden
# çalıştırır; önceki başarılı job'ların Artifact'leri OLDUĞU GİBİ
# kullanılır.
#
# HER JOB KENDİ BAĞIMSIZ ORTAMINDA ÇALIŞIR: bu yüzden her job, ihtiyaç
# duyduğu HER ŞEYİ (pip paketleri, ffmpeg gibi sistem paketleri) kendi
# içinde ayrı ayrı kurmak ZORUNDADIR - önceki job'da kurulan hiçbir şey
# sonrakine miras kalmaz. Bu dosyada ffmpeg gerektiren HER job'a
# (voiceover, align_subtitles, music_mix, scene_images, assemble_video,
# burn_subtitles) ffmpeg kurulumu ayrı ayrı eklenmiştir.
#
# MODEL NOTU: research.py ve generate_script.py Claude (ANTHROPIC_API_KEY)
# kullanıyor. generate_titles.py ve generate_thumbnail.py Gemini
# (GEMINI_API_KEY) kullanıyor - kapak üretimi gemini-2.5-flash-image ile
# (gemini-3-pro-image ücretsiz katmanda kullanılamıyor, kotası sıfır).
# Sahne görselleri (generate_scenes.py) hâlâ Wiro kullanıyor.
#
# Zamanlama SADECE cron-job.org üzerinden yönetiliyor (haftada 3 gün,
# 11:00 Türkiye saati). GitHub'ın kendi "schedule" tetikleyicisi
# BİLEREK yok. Video, upload_youtube.py sayesinde YouTube'un kendi
# zamanlı yayın özelliğiyle 21:00 TR'de otomatik yayına giriyor.
#
# NİŞ KONTROLÜ YENİDEN DENEME: research + script + title + niche-check
# adımları TEK bir döngü içinde, en fazla 5 kez farklı alt-nişle
# denenir.
#
# BUGÜNKÜ KRİTİK DÜZELTME (used_topics.json / used_comments.json):
# Önceden save_topic_history job'ı bu iki dosyayı "touch" ile
# (yani BOŞ/olduğu gibi) commit ediyordu - content ve upload_youtube
# job'larının KENDİ İZOLE ortamlarında yaptığı gerçek güncellemeler
# hiçbir Artifact'e yüklenmediği için kayboluyordu. Sonuç: niş/konu
# rotasyonu ve yorum tekrarı önleme mekanizmaları kağıt üstünde doğru
# görünüyor ama PRATİKTE HİÇ ÇALIŞMIYORDU. Şimdi:
#   - content job'ı used_topics.json'ı da content-bundle Artifact'ine
#     ekliyor.
#   - upload_youtube job'ı used_comments.json'ı ayrı bir Artifact
#     olarak yüklüyor.
#   - save_topic_history bu Artifact'leri İNDİRİP commit ediyor,
#     touch ile üzerine boş dosya yazmıyor.

on:
  workflow_dispatch:
    inputs:
      topic_hint:
        description: "Konu ipucu (opsiyonel, boşsa otomatik seçer)"
        required: false
        default: ""
      test_mode:
        description: "Hızlı test modu (çok kısa ~1 dk video, hızlı iterasyon için)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:

  # ---------------------------------------------------------------
  # 0) Bu koşunun nişini seç
  # ---------------------------------------------------------------
  pick_niche:
    runs-on: ubuntu-latest
    outputs:
      topic_hint: ${{ steps.pick.outputs.topic_hint }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Pick this run's niche (feeds trend query + research)
        id: pick
        env:
          TOPIC_HINT_INPUT: ${{ github.event.inputs.topic_hint }}
        run: |
          if [ -n "$TOPIC_HINT_INPUT" ]; then
            echo "topic_hint=$TOPIC_HINT_INPUT" >> "$GITHUB_OUTPUT"
            echo "Elle verilen konu ipucu kullanılıyor: $TOPIC_HINT_INPUT"
          else
            PICKED=$(python -c "
          import sys
          sys.path.insert(0, 'scripts')
          from research import SUB_NICHES, pick_sub_niche, load_used_topics
          used = load_used_topics()
          print(pick_sub_niche(len(used)))
          ")
            echo "topic_hint=$PICKED" >> "$GITHUB_OUTPUT"
            echo "Bu koşu için otomatik seçilen niş: $PICKED"
          fi

  # ---------------------------------------------------------------
  # 1) Trend analysis
  # ---------------------------------------------------------------
  trend_analysis:
    needs: pick_niche
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Trend analysis (what's actually working right now)
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TOPIC_HINT: ${{ needs.pick_niche.outputs.topic_hint }}
        run: python scripts/trend_analysis.py --out trend.json
      - uses: actions/upload-artifact@v4
        with:
          name: trend-json
          path: trend.json
          retention-days: 3

  # ---------------------------------------------------------------
  # 2-4.5) Research + script + title + niche-check
  # ---------------------------------------------------------------
  content:
    needs: [pick_niche, trend_analysis]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: trend-json
      - name: "Research + script + title + niche-check (uyumsuzsa otomatik 5 kez farklı konuyla dener)"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TOPIC_HINT: ${{ needs.pick_niche.outputs.topic_hint }}
          TEST_FLAG: ${{ github.event.inputs.test_mode == 'true' && '--test' || '' }}
        run: |
          MAX_ATTEMPTS=5
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            echo "=== Deneme $attempt/$MAX_ATTEMPTS ==="
            export RETRY_OFFSET=$((attempt - 1))

            python scripts/research.py --out facts.json
            python scripts/generate_script.py --facts facts.json --trends trend.json --out script.md $TEST_FLAG
            python scripts/generate_titles.py --script script.md --out titles.json

            if python scripts/niche_check.py --script script.md --titles titles.json; then
              echo "Niş kontrolü geçti, devam ediliyor."
              break
            fi

            if [ "$attempt" -eq "$MAX_ATTEMPTS" ]; then
              echo "$MAX_ATTEMPTS deneme sonunda hiçbir konu niş kontrolünden geçemedi, iş durduruluyor."
              exit 1
            fi

            echo "Niş kontrolü başarısız, farklı bir alt-nişle yeniden deneniyor..."
          done
      - uses: actions/upload-artifact@v4
        with:
          name: content-bundle
          path: |
            facts.json
            script.md
            titles.json
            used_topics.json
          retention-days: 7

  # ---------------------------------------------------------------
  # 5) Voiceover (Wiro voice-clone) - ffmpeg gerektirir
  # ---------------------------------------------------------------
  voiceover:
    needs: content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps (ffmpeg dahil)
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg libsndfile1
          pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: content-bundle
      - name: Voiceover (Wiro voice-clone)
        env:
          WIRO_API_KEY: ${{ secrets.WIRO_API_KEY }}
          VOICE_REFERENCE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/assets/voice/reference.wav
        run: python scripts/tts.py --script script.md --out audio/voiceover.mp3
      - uses: actions/upload-artifact@v4
        with:
          name: voiceover-audio
          path: audio/voiceover.mp3
          retention-days: 7

  # ---------------------------------------------------------------
  # 5b) Kelime zaman damgaları (Whisper) - ffmpeg gerektirir
  # ---------------------------------------------------------------
  align_subtitles:
    needs: voiceover
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps (ffmpeg dahil)
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg libsndfile1
          pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: voiceover-audio
          path: audio
      - name: Extract word timestamps (Whisper, provider-independent)
        run: python scripts/align_subtitles.py --audio audio/voiceover.mp3 --out audio/alignment.json
      - uses: actions/upload-artifact@v4
        with:
          name: alignment-json
          path: audio/alignment.json
          retention-days: 7

  # ---------------------------------------------------------------
  # 6) Background music mix - ffmpeg gerektirir
  # ---------------------------------------------------------------
  music_mix:
    needs: voiceover
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps (ffmpeg dahil)
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg libsndfile1
          pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: voiceover-audio
          path: audio
      - name: Background music mix (random track from pool)
        run: |
          python scripts/mix_audio.py --voice audio/voiceover.mp3 \
            --music-dir assets/music/ --out audio/final_mix.mp3
      - uses: actions/upload-artifact@v4
        with:
          name: final-mix-audio
          path: audio/final_mix.mp3
          retention-days: 7

  # ---------------------------------------------------------------
  # 7) Scene images (Pexels + Wiro) - ffmpeg gerektirebilir (video klipler)
  # ---------------------------------------------------------------
  scene_images:
    needs: content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps (ffmpeg dahil)
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: content-bundle
      - name: Scene images (Pexels stock + Wiro reve/generate)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WIRO_API_KEY: ${{ secrets.WIRO_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python scripts/generate_scenes.py --script script.md --out scenes/
      - uses: actions/upload-artifact@v4
        with:
          name: scenes-dir
          path: scenes/
          retention-days: 7

  # ---------------------------------------------------------------
  # 8) Thumbnail (Gemini - gemini-2.5-flash-image)
  # ---------------------------------------------------------------
  thumbnail:
    needs: [content, trend_analysis]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: content-bundle
      - uses: actions/download-artifact@v4
        with:
          name: trend-json
      - name: Thumbnail (Gemini)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_thumbnail.py --titles titles.json --out-dir output/thumbnails/
      - uses: actions/upload-artifact@v4
        with:
          name: thumbnails-dir
          path: output/thumbnails/
          retention-days: 7

  # ---------------------------------------------------------------
  # 9) Assemble video - ffmpeg gerektirir
  # ---------------------------------------------------------------
  assemble_video:
    needs: [content, music_mix, scene_images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps (ffmpeg dahil)
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu libsndfile1
          pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: content-bundle
      - uses: actions/download-artifact@v4
        with:
          name: final-mix-audio
          path: audio
      - uses: actions/download-artifact@v4
        with:
          name: scenes-dir
          path: scenes
      - name: Assemble video (Ken Burns + 15 transitions + callouts)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/assemble_video.py --audio audio/final_mix.mp3 --scenes scenes/ --script script.md --out output/raw.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: raw-video
          path: output/raw.mp4
          retention-days: 7

  # ---------------------------------------------------------------
  # 10) Burn subtitles - ffmpeg gerektirir
  # ---------------------------------------------------------------
  burn_subtitles:
    needs: [assemble_video, align_subtitles]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps (ffmpeg dahil)
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu libsndfile1
          pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: raw-video
          path: output
      - uses: actions/download-artifact@v4
        with:
          name: alignment-json
          path: audio
      - name: Burn subtitles (synced from Whisper timestamps)
        run: |
          python scripts/subtitles.py --alignment audio/alignment.json \
            --video output/raw.mp4 --out output/final.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: final-video
          path: output/final.mp4
          retention-days: 14

  # ---------------------------------------------------------------
  # 11) Upload to YouTube
  # ---------------------------------------------------------------
  upload_youtube:
    needs: [burn_subtitles, thumbnail, content, align_subtitles]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: content-bundle
      - uses: actions/download-artifact@v4
        with:
          name: alignment-json
          path: audio
      - uses: actions/download-artifact@v4
        with:
          name: final-video
          path: output
      - uses: actions/download-artifact@v4
        with:
          name: thumbnails-dir
          path: output/thumbnails
      - name: Upload to YouTube (scheduled publish at target hour)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          python scripts/upload_youtube.py --video output/final.mp4 \
            --titles titles.json --thumbnail output/thumbnails/thumbnail_1.png \
            --script script.md --facts facts.json --alignment audio/alignment.json
      - uses: actions/upload-artifact@v4
        with:
          name: used-comments-json
          path: used_comments.json
          retention-days: 7
          if-no-files-found: warn

  # ---------------------------------------------------------------
  # 12) Konu geçmişi + sahne kütüphanesini repoya geri commit et
  # ---------------------------------------------------------------
  save_topic_history:
    needs: [upload_youtube, scene_images, content]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: content-bundle
      - uses: actions/download-artifact@v4
        with:
          name: used-comments-json
      - uses: actions/download-artifact@v4
        with:
          name: scenes-dir
          path: assets/scene_library
      - name: Save topic history and scene library (prevent future repeats, reuse images)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p assets/scene_library
          git add used_topics.json used_comments.json assets/scene_library/
          git diff --staged --quiet && echo "Değişiklik yok" || git commit -m "Update used topics history and scene image library"
          git pull --rebase origin main || true
          git push
