name: Produce Video (fully automated)

# Uçtan uca otomatik: araştırma -> script (+kalite kontrolü) -> başlık
# -> seslendirme -> altyazı -> sahne görselleri -> kapak -> render ->
# müzik miksajı -> altyazı gömme -> upload.

on:
  # -------------------------------------------------------------------
  # OTOMATİK ÇALIŞTIRMA (haftada 2 kez: Pazartesi & Perşembe 09:00 UTC = 12:00 TR)
  # ŞU AN KAPALI. İlk test (test_mode) BAŞARILI olduktan SONRA aşağıdaki
  # "schedule:" ve "- cron:" satırlarının başındaki "# " işaretlerini
  # kaldırarak otomatiği aç. Test etmeden otomatiğe güvenme.
  # schedule:
  #   - cron: "0 9 * * 1,4"
  workflow_dispatch:
    inputs:
      topic_hint:
        description: "Konu ipucu (opsiyonel, boşsa otomatik seçer)"
        required: false
        default: ""
      test_mode:
        description: "Hızlı test modu (~1 dk kısa video, YouTube'a YÜKLEMEZ)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:

  # ---------------------------------------------------------------
  # 0) Bu koşunun nişini seç
  # ---------------------------------------------------------------
  pick_niche:
    runs-on: ubuntu-latest
    outputs:
      topic_hint: ${{ steps.pick.outputs.topic_hint }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Pick this run's niche
        id: pick
        env:
          TOPIC_HINT_INPUT: ${{ github.event.inputs.topic_hint }}
        run: |
          if [ -n "$TOPIC_HINT_INPUT" ]; then
            echo "topic_hint=$TOPIC_HINT_INPUT" >> "$GITHUB_OUTPUT"
          else
            PICKED=$(python -c "
          import sys
          sys.path.insert(0, 'scripts')
          from research import SUB_NICHES, pick_sub_niche, load_used_topics
          used = load_used_topics()
          print(pick_sub_niche(len(used)))
          ")
            echo "topic_hint=$PICKED" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------
  # 1) Trend analysis
  # ---------------------------------------------------------------
  trend_analysis:
    needs: pick_niche
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Trend analysis
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TOPIC_HINT: ${{ needs.pick_niche.outputs.topic_hint }}
        run: python scripts/trend_analysis.py --out trend.json
      - uses: actions/upload-artifact@v4
        with:
          name: trend-json
          path: trend.json
          retention-days: 3

  # ---------------------------------------------------------------
  # 2-4.5) Research + script + title + KALİTE + NİŞ/TEKRAR KAPISI
  # ---------------------------------------------------------------
  content:
    needs: [pick_niche, trend_analysis]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: trend-json
      - name: "Research + script + title + Quality/Niche Gate (max 5 attempts)"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TOPIC_HINT: ${{ needs.pick_niche.outputs.topic_hint }}
          TEST_FLAG: ${{ github.event.inputs.test_mode == 'true' && '--test' || '' }}
        run: |
          MAX_ATTEMPTS=5
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            echo "=== Deneme $attempt/$MAX_ATTEMPTS ==="

            # 2. denemeden itibaren farklı bir alt-niş dene (aynı reddedilen
            # konuya tekrar takılmamak için): TOPIC_HINT'i bırak, research.py
            # RETRY_OFFSET ile güvenli alt-nişlerden seçsin.
            if [ "$attempt" -gt 1 ]; then
              unset TOPIC_HINT
              export RETRY_OFFSET=$((attempt-1))
            fi

            python scripts/research.py --out facts.json
            python scripts/generate_script.py --facts facts.json --trends trend.json --out script.md $TEST_FLAG
            python scripts/generate_titles.py --script script.md --out titles.json

            # TEST MODU: kısa script üretilir; ağır kapılar (uzunluk/niş/tekrar)
            # atlanır - amaç sadece zincirin uçtan uca döndüğünü görmek.
            if [ -n "$TEST_FLAG" ]; then
              python scripts/quality_gate.py --script script.md --titles titles.json --test || true
              echo "Test modu: kapılar atlandı, devam."
              break
            fi

            # BÖLÜM 28 KALİTE KAPISI + BÖLÜM 12/13 NİŞ & TEKRAR KAPISI.
            # niche_check.py used_topics.json'ı GEÇTİKTEN SONRA günceller
            # (tekrar önleme hafızası artık gerçekten büyür).
            if python scripts/quality_gate.py --script script.md --titles titles.json \
               && python scripts/niche_check.py --script script.md --titles titles.json --facts facts.json; then
              echo "Tüm kapılar geçti, devam ediliyor."
              break
            fi

            if [ "$attempt" -eq "$MAX_ATTEMPTS" ]; then
              echo "5 deneme sonunda kapılardan geçemedi, iş durduruluyor."
              exit 1
            fi
            echo "Kapı başarısız, farklı alt-nişle yeniden deneniyor..."
          done

      - name: Select Visual Style (Bölüm 26)
        run: |
          python scripts/visual_style_selector.py --niche "${{ needs.pick_niche.outputs.topic_hint }}" > visual_style.txt
          cat visual_style.txt

      - uses: actions/upload-artifact@v4
        with:
          name: content-bundle
          path: |
            facts.json
            script.md
            titles.json
            visual_style.txt
            used_topics.json
            used_titles.json
          retention-days: 7

  # ---------------------------------------------------------------
  # 5) Voiceover (Wiro voice-clone)
  # ---------------------------------------------------------------
  voiceover:
    needs: content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg libsndfile1
          pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: content-bundle
      - name: Voiceover (Wiro)
        env:
          WIRO_API_KEY: ${{ secrets.WIRO_API_KEY }}
          VOICE_REFERENCE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/assets/voice/reference.wav
        run: python scripts/tts.py --script script.md --out audio/voiceover.mp3
      - uses: actions/upload-artifact@v4
        with:
          name: voiceover-audio
          path: audio/voiceover.mp3
          retention-days: 7

  # ---------------------------------------------------------------
  # 5b) Kelime zaman damgaları (Whisper)
  # ---------------------------------------------------------------
  align_subtitles:
    needs: voiceover
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg libsndfile1
          pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: voiceover-audio
          path: audio
      - name: Extract word timestamps (Whisper)
        run: python scripts/align_subtitles.py --audio audio/voiceover.mp3 --out audio/alignment.json
      - uses: actions/upload-artifact@v4
        with:
          name: alignment-json
          path: audio/alignment.json
          retention-days: 7

  # ---------------------------------------------------------------
  # 6) Background music mix
  # ---------------------------------------------------------------
  music_mix:
    needs: voiceover
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg libsndfile1
          pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: voiceover-audio
          path: audio
      - name: Background music mix
        run: python scripts/mix_audio.py --voice audio/voiceover.mp3 --music-dir assets/music/ --out audio/final_mix.mp3
      - uses: actions/upload-artifact@v4
        with:
          name: final-mix-audio
          path: audio/final_mix.mp3
          retention-days: 7

  # ---------------------------------------------------------------
  # 7) Scene images (Pexels stok video)
  # ---------------------------------------------------------------
  scene_images:
    needs: content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: content-bundle
      - name: Scene images (Pexels stock video)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python scripts/generate_scenes.py --script script.md --out scenes/
      - uses: actions/upload-artifact@v4
        with:
          name: scenes-dir
          path: scenes/
          retention-days: 7

  # ---------------------------------------------------------------
  # 8) Thumbnail (Gemini)
  # ---------------------------------------------------------------
  thumbnail:
    needs: [content, trend_analysis]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: content-bundle
      - uses: actions/download-artifact@v4
        with:
          name: trend-json
      - name: Thumbnail (Gemini)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_thumbnail.py --titles titles.json --out-dir output/thumbnails/
      - uses: actions/upload-artifact@v4
        with:
          name: thumbnails-dir
          path: output/thumbnails/
          retention-days: 7

  # ---------------------------------------------------------------
  # 9) Assemble video
  # ---------------------------------------------------------------
  assemble_video:
    needs: [content, music_mix, scene_images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu libsndfile1
          pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: content-bundle
      - uses: actions/download-artifact@v4
        with:
          name: final-mix-audio
          path: audio
      - uses: actions/download-artifact@v4
        with:
          name: scenes-dir
          path: scenes
      - name: Assemble video
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/assemble_video.py --audio audio/final_mix.mp3 --scenes scenes/ --script script.md --out output/raw.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: raw-video
          path: output/raw.mp4
          retention-days: 7

  # ---------------------------------------------------------------
  # 10) Burn subtitles
  # ---------------------------------------------------------------
  burn_subtitles:
    needs: [assemble_video, align_subtitles]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu libsndfile1
          pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: raw-video
          path: output
      - uses: actions/download-artifact@v4
        with:
          name: alignment-json
          path: audio
      - name: Burn subtitles
        run: python scripts/subtitles.py --alignment audio/alignment.json --video output/raw.mp4 --out output/final.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: final-video
          path: output/final.mp4
          retention-days: 14

  # ---------------------------------------------------------------
  # 11) Upload to YouTube (Bölüm 30) - TEST MODUNDA ATLANIR
  # ---------------------------------------------------------------
  upload_youtube:
    needs: [burn_subtitles, thumbnail, content, align_subtitles]
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.test_mode != 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: content-bundle
      - uses: actions/download-artifact@v4
        with:
          name: alignment-json
          path: audio
      - uses: actions/download-artifact@v4
        with:
          name: final-video
          path: output
      - uses: actions/download-artifact@v4
        with:
          name: thumbnails-dir
          path: output/thumbnails
      - name: Upload to YouTube (Private first, schedule publish)
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
        run: |
          python scripts/upload_youtube.py --video output/final.mp4 \
            --titles titles.json --thumbnail output/thumbnails/thumbnail_1.png \
            --script script.md --facts facts.json --alignment audio/alignment.json
      - uses: actions/upload-artifact@v4
        with:
          name: used-comments-json
          path: used_comments.json
          retention-days: 7
          if-no-files-found: warn

  # ---------------------------------------------------------------
  # 12) Konu geçmişi + sahne kütüphanesini repoya geri commit et
  # ---------------------------------------------------------------
  save_topic_history:
    needs: [upload_youtube, scene_images, content]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: content-bundle
      - uses: actions/download-artifact@v4
        with:
          name: used-comments-json
      - uses: actions/download-artifact@v4
        with:
          name: scenes-dir
          path: assets/scene_library
      - name: Save topic history and scene library
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p assets/scene_library
          for f in used_topics.json used_comments.json used_titles.json; do
            [ -f "$f" ] && git add "$f"
          done
          git add assets/scene_library/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Değişiklik yok, commit gerekmiyor."
            exit 0
          fi
          git commit -m "chore: update used topics history and scene image library [skip ci]"
          git fetch origin main || true
          git rebase origin/main || git rebase --abort
          git push origin HEAD:main || echo "Push çakışması, bir sonraki run'da çözülecek."
          exit 0
