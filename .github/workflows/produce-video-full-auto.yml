name: Produce Video (fully automated)

# Uçtan uca otomatik: araştırma -> script (+kalite kontrolü) -> başlık
# -> seslendirme -> altyazı -> sahne görselleri -> kapak -> render ->
# müzik miksajı -> altyazı gömme.
#
# Zamanlama SADECE cron-job.org üzerinden yönetiliyor (hafta içi her
# gün, 11:00 Türkiye saati - pipeline'a tampon süre vermek için).
# GitHub'ın kendi dahili "schedule" tetikleyicisi BİLEREK yok.
# Video ise upload_youtube.py sayesinde YouTube'un kendi zamanlı
# yayın özelliğiyle tam 17:00 TR'de otomatik yayına giriyor (ya da
# pipeline 17:00'i geçtikten sonra biterse hemen herkese açık olarak
# yayınlanıyor).
#
# GÜVENLİK AĞI: Herhangi bir adımda hata olsa bile (bkz. en alttaki
# "Save partial outputs" adımı), o ana kadar üretilen her şey
# (script, sesler, sahneler, kısmi video) Artifacts olarak kaydedilir,
# hiçbir şey boşa gitmez.

on:
  workflow_dispatch:
    inputs:
      topic_hint:
        description: "Konu ipucu (opsiyonel, boşsa otomatik seçer)"
        required: false
        default: ""
      test_mode:
        description: "Hızlı test modu (çok kısa ~1 dk video, hızlı iterasyon için)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write   # used_topics.json ve scene library'yi repoya geri commit edebilmek için

jobs:
  produce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps (ffmpeg dahil)
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu libsndfile1
          pip install -r requirements.txt

      - name: 1) Trend analysis (what's actually working right now)
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/trend_analysis.py --query "gaming psychology facts documentary" --out trend.json

      - name: 2) Research
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TOPIC_HINT: ${{ github.event.inputs.topic_hint }}
        run: python scripts/research.py --out facts.json

      - name: 3) Generate + quality-check script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TEST_FLAG: ${{ github.event.inputs.test_mode == 'true' && '--test' || '' }}
        run: python scripts/generate_script.py --facts facts.json --trends trend.json --out script.md $TEST_FLAG

      - name: "4) Generate title (curiosity-gap: thumbnail asks, title develops)"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_titles.py --script script.md --out titles.json
        
      - name: 4.5) Niche check (gate before expensive steps)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/niche_check.py --script script.md --titles titles.json
        
      - name: 5) Voiceover (Wiro voice-clone)
        env:
          WIRO_API_KEY: ${{ secrets.WIRO_API_KEY }}
          VOICE_REFERENCE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/assets/voice/reference.wav
        run: python scripts/tts.py --script script.md --out audio/voiceover.mp3

      - name: 5b) Extract word timestamps (Whisper, provider-independent)
        run: python scripts/align_subtitles.py --audio audio/voiceover.mp3 --out audio/alignment.json

      - name: 6) Background music mix (random track from pool)
        run: |
          python scripts/mix_audio.py --voice audio/voiceover.mp3 \
            --music-dir assets/music/ --out audio/final_mix.mp3

      - name: 7) Scene images (Pexels stock + Wiro reve/generate)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WIRO_API_KEY: ${{ secrets.WIRO_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python scripts/generate_scenes.py --script script.md --out scenes/

      - name: 8) Thumbnail (Wiro reve/generate)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WIRO_API_KEY: ${{ secrets.WIRO_API_KEY }}
        run: python scripts/generate_thumbnail.py --titles titles.json --out-dir output/thumbnails/

      - name: 9) Assemble video (Ken Burns + 15 transitions + callouts)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/assemble_video.py --audio audio/final_mix.mp3 --scenes scenes/ --script script.md --out output/raw.mp4
      
      - name: 9.5) Add avatar overlay (fake lip-sync + blink + bob)
        run: |
          python scripts/avatar_overlay.py --video output/raw.mp4 \
            --audio audio/final_mix.mp3 --frames-dir assets/avatar \
            --out output/raw_with_avatar.mp4
            
      - name: 10) Burn subtitles (synced from Whisper timestamps)
        run: |
          python scripts/subtitles.py --alignment audio/alignment.json \
            --video output/raw.mp4 --out output/final.mp4

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video-and-assets
          path: |
            output/final.mp4
            output/thumbnails/
            titles.json
          retention-days: 14

      - name: 11) Upload to YouTube (scheduled publish at target hour)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          python scripts/upload_youtube.py --video output/final.mp4 \
            --titles titles.json --thumbnail output/thumbnails/thumbnail_1.png

      - name: 12) Save topic history and scene library (prevent future repeats, reuse images)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          touch used_topics.json
          mkdir -p assets/scene_library
          git add used_topics.json assets/scene_library/
          git diff --staged --quiet && echo "Değişiklik yok" || git commit -m "Update used topics history and scene image library"
          git push

      - name: Save partial outputs (runs even if an earlier step failed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: partial-outputs-run-${{ github.run_number }}
          path: |
            trend.json
            facts.json
            script.md
            titles.json
            audio/
            scenes/
            output/
          if-no-files-found: ignore
          retention-days: 14
